services:
  - type: web
    name: agri-market
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py bootstrap_owner"
    startCommand: "gunicorn agri_market.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /ready/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: ENABLE_DEMO_DATA
        value: "False"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "True"
      - key: ADMIN_MFA_REQUIRED
        value: "True"
      - key: TRUST_X_FORWARDED_FOR
        value: "True"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: ORDER_RESERVATION_MINUTES
        value: "30"
      - key: REFUND_REQUEST_DAYS
        value: "7"
      - key: EMAIL_MAX_ATTEMPTS
        value: "5"
      - key: FLAT_SHIPPING_FEE
        value: "50.00"
      - key: FREE_SHIPPING_THRESHOLD
        value: "500.00"
      - key: PLATFORM_FEE_PERCENT
        value: "5.00"
      - key: SETTLEMENT_HOLD_DAYS
        value: "2"
      - key: STRIPE_CONNECT_TRANSFERS_ENABLED
        value: "False"
      - key: TERMS_VERSION
        value: "2026-07"
      - key: PRIVACY_VERSION
        value: "2026-07"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agri-market-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: INITIAL_OWNER_USERNAME
        sync: false
      - key: INITIAL_OWNER_EMAIL
        sync: false
      - key: INITIAL_OWNER_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"

databases:
  - name: agri-market-db
    region: singapore
    plan: free
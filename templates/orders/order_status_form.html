{% extends "base.html" %}

{% block title %}ปรับสถานะคำสั่งซื้อ{% endblock %}

{% block content %}
<section class="mx-auto max-w-md">
  <h1 class="text-2xl font-semibold text-slate-950">คำสั่งซื้อ #{{ order.id }}</h1>
  <form method="post" class="mt-5 space-y-4 rounded-md border border-stone-200 bg-white p-5 shadow-sm">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="text-sm font-medium text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <div class="mt-1">{{ field }}</div>
      </div>
    {% endfor %}
    <button class="rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700" type="submit">บันทึกสถานะ</button>
  </form>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl">
  <form method="post" class="rounded-md border border-stone-200 bg-white p-6 shadow-soft">
    {% csrf_token %}
    <h1 class="text-2xl font-semibold text-slate-950">{{ title }}</h1>
    <div class="mt-6 grid gap-4 sm:grid-cols-2">
      {% for field in form %}
        <div class="{% if field.name == 'summary' or field.name == 'body' %}sm:col-span-2{% endif %}">
          <label class="text-sm font-semibold text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <div class="mt-2">{{ field }}</div>
          {% for error in field.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
    </div>
    <button class="mt-6 rounded-md bg-leaf px-5 py-2.5 text-sm font-semibold text-white" type="submit">บันทึกข่าวสาร</button>
  </form>
</section>
{% endblock %}

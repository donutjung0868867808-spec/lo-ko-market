{% extends "base.html" %}
{% block title %}ปิดบัญชี{% endblock %}
{% block content %}
<section class="mx-auto max-w-lg border border-stone-200 bg-white p-6 shadow-sm">
  <h1 class="text-2xl font-semibold text-slate-950">ปิดบัญชี</h1>
  <p class="mt-2 text-sm text-slate-600">คำสั่งซื้อและข้อมูลทางการเงินจะเก็บไว้ตามระยะเวลาที่กฎหมายกำหนด ข้อมูลส่วนบุคคลที่ไม่จำเป็นจะถูกลบหรือทำให้อ่านไม่ออก</p>
  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    <div><label class="mb-2 block font-semibold" for="id_password">ยืนยันรหัสผ่าน</label><input class="w-full rounded-md border border-stone-300 px-4 py-3" id="id_password" name="password" type="password" required></div>
    <button class="rounded-md bg-red-700 px-5 py-3 font-semibold text-white" type="submit">ยืนยันการปิดบัญชี</button>
  </form>
</section>
{% endblock %}

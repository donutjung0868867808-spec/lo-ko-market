{% extends "base.html" %}

{% block title %}ลบข่าวสาร{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl rounded-md border border-stone-200 bg-white p-6 shadow-soft">
  <h1 class="text-2xl font-semibold text-slate-950">ลบข่าวสาร</h1>
  <p class="mt-3 text-sm text-slate-600">ต้องการลบ “{{ post.title }}” ใช่ไหม</p>
  <form method="post" class="mt-6 flex gap-2">
    {% csrf_token %}
    <button class="rounded-md bg-red-700 px-4 py-2 text-sm font-semibold text-white" type="submit">ลบ</button>
    <a class="rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700" href="{% url 'accounts:news_manage' %}">ยกเลิก</a>
  </form>
</section>
{% endblock %}

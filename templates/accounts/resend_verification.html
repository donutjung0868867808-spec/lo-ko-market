{% extends "base.html" %}
{% block title %}ส่งอีเมลยืนยันใหม่{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl">
  <div class="rounded-md border border-stone-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-950">ส่งอีเมลยืนยันใหม่</h1>
    <form method="post" class="mt-5 space-y-4">
      {% csrf_token %}
      <div>
        <label class="text-sm font-semibold text-slate-700" for="email">อีเมลที่ใช้สมัคร</label>
        <input class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5" id="email" name="email" type="email" required>
      </div>
      <button class="rounded-md bg-leaf px-5 py-2.5 text-sm font-semibold text-white" type="submit">ส่งลิงก์ยืนยัน</button>
    </form>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}รายงานสินค้า{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl">
  <form method="post" enctype="multipart/form-data" class="rounded-md border border-stone-200 bg-white p-6 shadow-soft">
    {% csrf_token %}
    <p class="text-sm font-semibold text-leaf">{{ product.name }}</p>
    <h1 class="mt-2 text-2xl font-semibold text-slate-950">รายงานสินค้า</h1>
    <div class="mt-6 space-y-4">
      {% for field in form %}
        <div>
          <label class="text-sm font-semibold text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <div class="mt-2">{{ field }}</div>
          {% for error in field.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
    </div>
    <button class="mt-6 rounded-md bg-amber-700 px-5 py-2.5 text-sm font-semibold text-white" type="submit">ส่งรายงาน</button>
  </form>
</section>
{% endblock %}

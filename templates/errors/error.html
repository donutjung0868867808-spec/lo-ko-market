{% extends "base.html" %}

{% block title %}{{ status_code }} - {{ error_title }}{% endblock %}

{% block content %}
<section class="mx-auto flex min-h-[58vh] max-w-2xl items-center py-10">
  <div class="w-full border-l-4 border-leaf bg-white px-6 py-8 shadow-soft sm:px-10 sm:py-12">
    <p class="text-sm font-semibold text-leaf">ข้อผิดพลาด {{ status_code }}</p>
    <h1 class="mt-2 text-3xl font-bold text-ink">{{ error_title }}</h1>
    <p class="mt-4 leading-7 text-slate-600">{{ error_message }}</p>
    <div class="mt-7 flex flex-wrap gap-3">
      <a href="{{ action_url }}" class="rounded-md bg-leaf px-5 py-3 font-semibold text-white hover:bg-emerald-800">
        {{ action_label }}
      </a>
      <a href="{% url 'catalog:contact' %}" class="rounded-md border border-stone-300 bg-white px-5 py-3 font-semibold text-slate-700 hover:bg-stone-100">
        ติดต่อเรา
      </a>
    </div>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}ยกเลิกการชำระเงิน{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl rounded-md border border-stone-200 bg-white p-6 shadow-sm">
  <h1 class="text-2xl font-semibold text-slate-950">ยกเลิกการชำระเงิน</h1>
  <p class="mt-2 text-slate-700">คำสั่งซื้อ #{{ order.id }} ยังอยู่ในสถานะรอชำระเงิน</p>
  <a class="mt-5 inline-flex rounded-md bg-leaf px-4 py-2 font-medium text-white hover:bg-emerald-800" href="{{ order.get_absolute_url }}">กลับไปที่คำสั่งซื้อ</a>

{% endblock %}
